name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
env:
  NEXT_PUBLIC_APP_NAME: Prepstore
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci
  AUTH_SECRET: ci-auth-secret-123456789012345678901234
  PASSWORD_PEPPER: ci-password-pepper-1234567890
  MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-123456789012345
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Run database integration tests
        run: npm run test:integration
        env:
          RUN_INTEGRATION_TESTS: "true"
          RUN_COMMERCE_INTEGRATION: "true"
          RUN_MATERIALS_INTEGRATION: "true"
          RUN_ATTEMPT_INTEGRATION: "true"
          INTEGRATION_TIMEOUT_MS: "120000"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/auth-verification-responsive.spec.ts
